name: Update signals

on:
  schedule:
    - cron: "30 7 * * 1-5"  # 北京时间工作日 15:30（UTC 07:30）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch quotes
        run: python scripts/fetch_data.py

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Fetch foreign quotes
        run: python scripts/fetch_foreign.py

      - name: Fetch macro news
        run: python scripts/fetch_macro_news.py

      - name: Score signals
        run: python scripts/score.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Update signals $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
